# PROKOPOV alarm — 2.8" touch panel (ESP32-2432S028 "CYD") on the RS-485 bus of the main board (J9).
# Wiring at the panel: J9 +12V -> small 12->5 V buck -> CYD 5 V; GND; A/B -> RS-485 module with AUTOMATIC
# direction control (the CYD has only two free outputs: GPIO22 = TX, GPIO27 = RX on connector CN1).
# The panel never decides anything itself: it shows the board's state and forwards PIN + action, signed.
substitutions:
  name: prokopov-panel

esphome:
  name: ${name}
  friendly_name: PROKOPOV Panel

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0                # UART0 stays free; logs over Wi-Fi/API only

# The panel works without Wi-Fi (RS-485 only). Wi-Fi is just for OTA updates.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
api:
  encryption:
    key: !secret panel_api_key
ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/ivprokopov/esp32-alarm-controller
      ref: v3-board
    components: [prokopov_panel_link]

uart:
  id: rs485
  tx_pin: GPIO22
  rx_pin: GPIO27
  baud_rate: 38400

globals:
  - {id: pin_buf, type: std::string, restore_value: false, initial_value: '""'}
  - {id: pending_action, type: int, restore_value: false, initial_value: '0'}
  - {id: last_seen_result_seq, type: uint32_t, restore_value: false, initial_value: '0'}

prokopov_panel_link:
  id: link
  uart_id: rs485
  key: !secret panel_link_key
  on_status:
    - lambda: |-
        static const char *names[] = {"ИЗКЛЮЧЕНА", "ИЗХОД...", "ПОД ОХРАНА", "ВКЪЩИ", "НОЩ", "ВХОД...",
                                      "АЛАРМА!", "ПАНИК!", "ПАНИК"};
        const char *t = x.online ? (x.state < 9 ? names[x.state] : "?") : "НЯМА ВРЪЗКА";
        lv_label_set_text(id(lbl_state), t);
        char buf[48];
        if (x.remaining_s) snprintf(buf, sizeof(buf), "%u s", x.remaining_s); else buf[0] = 0;
        lv_label_set_text(id(lbl_timer), buf);
        lv_label_set_text(id(lbl_info), (x.flags & 0x01) ? "готова" : "отворена зона");
        uint32_t c = x.state == 6 || x.state == 7 ? 0xD32F2F : (x.state >= 2 && x.state <= 5) ? 0x1565C0 : 0x2E7D32;
        lv_obj_set_style_bg_color(id(top_bar), lv_color_hex(c), 0);
        if (x.result_seq != id(last_seen_result_seq)) {
          id(last_seen_result_seq) = x.result_seq;
          static const char *res[] = {"", "OK", "заключено", "под охрана", "изключена", "ГРЕШЕН КОД",
                                      "има отворена зона", "", "БЛОКИРАНО 5 мин"};
          lv_label_set_text(id(lbl_result), x.result < 9 ? res[x.result] : "");
        }

spi:
  - id: spi_lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - {platform: ledc, pin: GPIO21, id: backlight_pwm}
light:
  - {platform: monochromatic, output: backlight_pwm, name: "Backlight", id: backlight, restore_mode: ALWAYS_ON}

display:
  - platform: ili9xxx
    id: lcd
    model: ILI9341
    spi_id: spi_lcd
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    color_palette: 8BIT
    dimensions: {width: 240, height: 320}
    rotation: 0
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: spi_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    calibration: {x_min: 280, x_max: 3860, y_min: 340, y_max: 3860}

font:
  - file: "gfonts://Roboto"
    id: f_big
    size: 26
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: f_small
    size: 16
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  pages:
    - id: main
      bg_color: 0x101418
      widgets:
        - obj:
            id: top_bar
            x: 0
            y: 0
            width: 240
            height: 70
            radius: 0
            border_width: 0
            bg_color: 0x2E7D32
            widgets:
              - label: {id: lbl_state, text: "...", text_font: f_big, text_color: 0xFFFFFF, align: TOP_MID, y: 4}
              - label: {id: lbl_timer, text: "", text_font: f_small, text_color: 0xFFFFFF, align: BOTTOM_LEFT}
              - label: {id: lbl_info, text: "", text_font: f_small, text_color: 0xFFFFFF, align: BOTTOM_RIGHT}
        - label: {id: lbl_pin, text: "", text_font: f_big, text_color: 0xFFFFFF, align: TOP_MID, y: 76}
        - label: {id: lbl_result, text: "", text_font: f_small, text_color: 0xFFCC80, align: TOP_MID, y: 106}
        - buttonmatrix:
            id: keypad
            x: 4
            y: 128
            width: 232
            height: 188
            text_font: f_big
            rows:
              - buttons: [{text: "1", on_press: {script.execute: {id: key_press, k: "1"}}}, {text: "2", on_press: {script.execute: {id: key_press, k: "2"}}}, {text: "3", on_press: {script.execute: {id: key_press, k: "3"}}}, {text: "ОХР", on_press: {script.execute: {id: key_press, k: "ОХР"}}}]
              - buttons: [{text: "4", on_press: {script.execute: {id: key_press, k: "4"}}}, {text: "5", on_press: {script.execute: {id: key_press, k: "5"}}}, {text: "6", on_press: {script.execute: {id: key_press, k: "6"}}}, {text: "НОЩ", on_press: {script.execute: {id: key_press, k: "НОЩ"}}}]
              - buttons: [{text: "7", on_press: {script.execute: {id: key_press, k: "7"}}}, {text: "8", on_press: {script.execute: {id: key_press, k: "8"}}}, {text: "9", on_press: {script.execute: {id: key_press, k: "9"}}}, {text: "ИЗК", on_press: {script.execute: {id: key_press, k: "ИЗК"}}}]
              - buttons: [{text: "C", on_press: {script.execute: {id: key_press, k: "C"}}}, {text: "0", on_press: {script.execute: {id: key_press, k: "0"}}}, {text: "ОТК", on_press: {script.execute: {id: key_press, k: "ОТК"}}}, {text: "ЗАК", on_press: {script.execute: {id: key_press, k: "ЗАК"}}}]

script:
  - id: key_press
    mode: queued
    parameters: {k: string}
    then:
      - lambda: |-
          int action = k == "ОХР" ? 1 : k == "НОЩ" ? 3 : k == "ИЗК" ? 4 : k == "ОТК" ? 5 : k == "ЗАК" ? 6 : 0;
          auto &buf = id(pin_buf);
          if (k == "C") { std::fill(buf.begin(), buf.end(), '0'); buf.clear(); }
          else if (action) {
            if (buf.size() >= 4) id(link).send_pin(action, buf);
            std::fill(buf.begin(), buf.end(), '0'); buf.clear();
          } else if (k.size() == 1 && buf.size() < 8) buf += k;
          lv_label_set_text(id(lbl_pin), std::string(buf.size(), '*').c_str());
      - light.turn_on: backlight
