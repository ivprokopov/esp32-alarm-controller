<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Алармена система</title>
<style>
:root{--bg:#08111e;--card:#111f32;--line:#29425f;--txt:#edf5ff;--muted:#9db0c8;--ok:#3dcc7e;--warn:#f2b943;--bad:#ef5264;--blue:#4d85f5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#284e7d,#08111e 48%,#050910);color:var(--txt);font:15px Arial,sans-serif}.app{width:min(1180px,calc(100% - 26px));margin:auto;padding:22px 0 42px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0 0;color:var(--muted)}.pill{border:1px solid #345a87;background:#122747;border-radius:999px;padding:9px 12px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,var(--card),#0d1726);border:1px solid var(--line);border-radius:17px;padding:16px}.card h2{margin:0 0 13px;font-size:17px}.hero{padding:22px;border-radius:14px;background:#2258ad}.hero b{font-size:32px}.hero p{margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.metric{background:#091422;border:1px solid #28425e;border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:13px;color:#fff;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.arm{background:#238c50}.night{background:#aa7710}.disarm{background:#3e78e8}.door{background:#4c596c}.panic{background:#bd2639}.zones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.zone{background:#19273a;border:1px solid #2d4562;border-radius:12px;padding:12px}.zone b{display:block}.zone small{color:var(--muted)}.status{float:right;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:bold}.normal{background:#153d29;color:#8beeb2}.active{background:#403113;color:#ffdd87}.alarm{background:#471923;color:#ffb4bd}.offline{background:#2c3747;color:#cfd9e8}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #28405c}.row:last-child{border:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px 6px;border-bottom:1px solid #28405c}.table th{color:var(--muted);font-size:11px}.login{display:flex;gap:8px;align-items:center}.login input{width:240px;max-width:45vw;background:#0b1626;color:#fff;border:1px solid #345a87;border-radius:9px;padding:10px}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;padding:13px 16px;border-radius:11px;background:#17304f;border:1px solid #4b75a5;display:none}.toast.show{display:block}.wide{grid-column:1/-1}@media(max-width:820px){.grid{grid-template-columns:1fr}.zones{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.login{width:100%}.login input{flex:1;max-width:none}.wide{grid-column:auto}}
</style>
</head>
<body><main class="app">
<header class="head"><div class="brand"><div style="font-size:30px">🛡️</div><div><h1>Алармена система</h1><p>Локален контролен панел</p></div></div><div class="login"><input id="token" type="password" placeholder="API token"><button id="saveToken" class="btn disarm">Вход</button></div></header>
<div class="grid">
<section class="card"><h2>Критичен статус</h2><div id="hero" class="hero"><b id="mode">НЯМА ДАННИ</b><p id="sub">Въведи API token</p><small id="updated">Последна актуализация: —</small></div><div class="metrics"><div class="metric"><b id="n0">0</b><span>нормални</span></div><div class="metric"><b id="n1">0</b><span>активни</span></div><div class="metric"><b id="n2">0</b><span>тревоги</span></div><div class="metric"><b id="n3">0</b><span>изолирани</span></div></div></section>
<section class="card"><h2>Бърз контрол</h2><div class="buttons"><button class="btn arm" data-c="arm_full">🔒 Пълно</button><button class="btn night" data-c="arm_night">🌙 Нощно</button><button class="btn arm" data-c="arm_perimeter">🌳 Периметър</button><button class="btn disarm" data-c="disarm">🔓 Разоръжи</button><button class="btn door" data-c="open_door">🚪 Отвори врата</button><button class="btn panic" data-c="silence_alarm">🔕 Спри сирена</button></div><button id="panic" class="btn panic" style="width:100%;margin-top:10px">🆘 PANIC / SOS</button><div class="row"><span>Врата</span><b id="door">—</b></div><div class="row"><span>Реле брава</span><b id="lock">—</b></div></section>
<section class="card wide"><h2>Жив статус на зоните</h2><div id="zones" class="zones"></div></section>
<section class="card"><h2>Системно здраве</h2><div id="health"></div></section>
<section class="card"><h2>Последни събития</h2><table class="table"><thead><tr><th>Час</th><th>Събитие</th><th>Ниво</th></tr></thead><tbody id="events"></tbody></table></section>
</div></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),DEVICE='olimex_esp32_evb_01';let token=sessionStorage.getItem('alarmToken')||'';$('token').value=token;function headers(){return {'X-API-Token':token,'Content-Type':'application/json'}}function toast(x,bad=false){let t=$('toast');t.textContent=x;t.style.borderColor=bad?'#ef5264':'#4b75a5';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}$('saveToken').onclick=()=>{token=$('token').value.trim();sessionStorage.setItem('alarmToken',token);refresh()};function fmt(ts){if(!ts)return'—';return new Date(ts*1000).toLocaleString('bg-BG')}function modeName(m){return({DISARMED:'РАЗОРЪЖЕНА',EXIT_DELAY:'ИЗХОДНО ЗАКЪСНЕНИЕ',ENTRY_DELAY:'ВХОДНО ЗАКЪСНЕНИЕ',ARMED_FULL:'ПЪЛНО ВЪОРЪЖЕНА',ARMED_NIGHT:'НОЩЕН РЕЖИМ',ARMED_PERIMETER:'ПЕРИМЕТЪР',ALARM:'ТРЕВОГА',PANIC:'PANIC / SOS'})[m]||m||'НЯМА ДАННИ'}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}async function command(c){try{document.querySelectorAll('[data-c],#panic').forEach(b=>b.disabled=true);let d=await api('/api/v1/devices/'+DEVICE+'/command',{method:'POST',body:JSON.stringify({command:c,payload:{}})});toast('Командата е изпратена: '+c);setTimeout(refresh,500)}catch(e){toast('Грешка при команда: '+e.message,true)}finally{document.querySelectorAll('[data-c],#panic').forEach(b=>b.disabled=false)}}document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>command(b.dataset.c));$('panic').onclick=()=>{if(confirm('Да се активира ли PANIC / SOS?'))command('panic')};function zoneHtml(id,z){let s=z.bypassed?'offline':z.status||'offline',txt={normal:'НОРМАЛНА',active:'АКТИВНА',alarm:'ТРЕВОГА',offline:'ИЗОЛИРАНА / OFFLINE'}[s]||s;return `<div class="zone"><span class="status ${s}">${txt}</span><b>${z.name||id}</b><small>${z.type||'зона'} · ${z.enabled===false?'изключена':'активна'} · ${fmt(z.changed_at)}</small></div>`}async function refresh(){if(!token){$('sub').textContent='Въведи API token';return}try{let [s,e]=await Promise.all([api('/api/v1/devices/'+DEVICE+'/status'),api('/api/v1/events?limit=20')]);let z=s.zones||{},vals=Object.values(z),m=s.mode;$('mode').textContent=modeName(m);$('hero').style.background=(m==='ALARM'||m==='PANIC')?'#8d2637':(m||'').includes('ARMED')?'#25764a':'#2258ad';$('sub').textContent=s.armed_target_mode?'Целеви режим: '+modeName(s.armed_target_mode):'Контролерът изпраща жив статус';$('updated').textContent='Последна актуализация: '+fmt(s.updated_at);$('n0').textContent=vals.filter(x=>x.status==='normal').length;$('n1').textContent=vals.filter(x=>x.status==='active').length;$('n2').textContent=vals.filter(x=>x.status==='alarm').length;$('n3').textContent=vals.filter(x=>x.bypassed).length;$('zones').innerHTML=Object.entries(z).map(([id,x])=>zoneHtml(id,x)).join('')||'<p>Няма данни за зони.</p>';$('door').textContent=s.door_status||'—';$('lock').textContent=s.lock_status||'—';let h=s.health||{};$('health').innerHTML=[['Контролер','ONLINE'],['Wi‑Fi',h.wifi_connected?'ONLINE':'OFFLINE'],['Сървър',h.server_connected?'ONLINE':'OFFLINE'],['MQTT',h.mqtt_connected?'ONLINE':'OFFLINE'],['SD',s.storage?.mounted?'OK':'ГРЕШКА'],['Свободна RAM',h.free_memory!=null?h.free_memory+' B':'—'],['Firmware',h.firmware_version||'—']].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('events').innerHTML=(e.events||[]).map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${x.code}</td><td>${x.level}</td></tr>`).join('')||'<tr><td colspan="3">Няма събития.</td></tr>'}catch(err){$('sub').textContent='Няма връзка или невалиден token';toast(err.message,true)}}refresh();setInterval(refresh,2000);
</script></body></html>
