services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: alarm-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./data/mosquitto:/mosquitto/data
      - ./logs/mosquitto:/mosquitto/log

  api:
    build: ./api
    container_name: alarm-api
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      ALARM_DB_PATH: /data/alarm.db
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      API_TOKEN: ${API_TOKEN}
    ports:
      - "8088:8080"
    volumes:
      - ./data/api:/data
