services:
  prokopov-alarm-server:
    build: .
    container_name: prokopov-alarm-server
    restart: unless-stopped
    ports:
      - "8099:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
